# Nginx reverse-proxy configuration for Ah-Slap! on Ubuntu
# Copy to: /etc/nginx/sites-available/ahslap
# Symlink: sudo ln -s /etc/nginx/sites-available/ahslap /etc/nginx/sites-enabled/ahslap

server {
    listen 80;
    server_name _;

    # Serve compiled React frontend from a shared directory (avoids /home/<user> 403 errors)
    root /var/www/ah-slap/html;
    index index.html;

    # Support client-side React Router routes (/login, /register, /dashboard)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to internal Node.js backend managed by PM2
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
